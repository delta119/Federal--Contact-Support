<script>
let supportSpeech;

function speakMessage() {
    window.speechSynthesis.cancel();

    supportSpeech = new SpeechSynthesisUtterance(
        "contact support. Please Federal Trade Commision ."
    );

    supportSpeech.onend = function() {
        if (window.repeatSupport) {

}

function stopMessage() {
    window.repeatSupport = false;
    window.speechSynthesis.cancel();
}
